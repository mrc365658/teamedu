<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Đỗ Linh 20/10 ❤️</title>
    <style>
        /* --- PHẦN STYLE GIAO DIỆN --- */
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap');

        body {
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f3e7e9, #e3eeff); /* Nền màu pastel nhẹ nhàng */
            overflow: hidden; /* Ngăn cuộn trang khi thư di chuyển */
            font-family: 'Quicksand', sans-serif;
        }

        /* --- BỨC THƯ "CHẠY TRỐN" --- */
        .letter-chase-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Căn giữa ban đầu */
            width: 200px;
            padding: 25px 0;
            background-color: #ff8fab; /* Màu hồng xinh xắn */
            color: white;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            user-select: none; /* Ngăn người dùng bôi đen chữ */
            
            /* Hiệu ứng chuyển động mượt mà */
            transition: top 0.4s ease-in-out, left 0.4s ease-in-out;
        }

        /* --- BỨC THƯ CUỐI CÙNG --- */
        .letter-final-container {
            /* Ẩn đi lúc đầu và chuẩn bị cho hiệu ứng xuất hiện */
            opacity: 0;
            visibility: hidden;
            transform: scale(0.9);
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
            
            /* Giao diện */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(255, 255, 255, 0.98);
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 90%;
            width: 550px;
        }
        
        /* Lớp 'visible' sẽ được thêm bằng JavaScript để hiện thư lên */
        .letter-final-container.visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .letter-final-container h1 {
            color: #d63384;
            font-size: 2.2em;
            margin-bottom: 20px;
        }

        .letter-final-container p {
            font-size: 1.15em;
            line-height: 1.8;
            color: #333;
        }

        .signature {
            text-align: right;
            margin-top: 30px;
            font-style: italic;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="letter-chase-container" id="chase-container">
        💌 Mở thư!
    </div>

    <div class="letter-final-container" id="final-letter">
        <h1>Chào sóc dễ thương nhá </h1>
        <p>Khi cậu đọc được bức thư này tớ chỉ muốn nói với cậu </p>
        <p>Nhân ngày 20/10, tớ chúc cậu ngày càng xinh đẹp hơn dù giờ đã xinh lắm rồi và cố gắng để đạt được mong ước của mình nhá </p>
        <p class="signature">Gửi sóc dễ thương</Mr><br>
        By MrC
        
        </p>
    </div>

    <script>
        // --- PHẦN LOGIC ĐIỀU KHIỂN ---
        window.onload = function() {
            const chaseContainer = document.getElementById('chase-container');
            const finalLetter = document.getElementById('final-letter');
            
            let clickCount = 0;
            const maxMoves = 5; // Số lần thư sẽ "chạy" đi

            chaseContainer.addEventListener('click', function() {
                if (clickCount < maxMoves) {
                    // Tăng biến đếm
                    clickCount++;

                    // Tính toán vị trí ngẫu nhiên mới trên màn hình
                    // Trừ đi kích thước của chính nó để không bị tràn ra ngoài
                    const newTop = Math.random() * (window.innerHeight - chaseContainer.offsetHeight);
                    const newLeft = Math.random() * (window.innerWidth - chaseContainer.offsetWidth);

                    // Cập nhật vị trí
                    chaseContainer.style.top = `${newTop}px`;
                    chaseContainer.style.left = `${newLeft}px`;

                    // Đến lần cuối cùng, thay đổi nội dung để báo hiệu
                    if (clickCount === maxMoves) {
                        chaseContainer.innerText = 'Bắt được rồi! Mở đi! 😊';
                    }
                } else {
                    // Khi đã click đủ 5 lần, lần click tiếp theo sẽ mở thư
                    chaseContainer.style.display = 'none'; // Ẩn thư "chạy trốn"
                    finalLetter.classList.add('visible'); // Hiện thư cuối cùng
                }
            });
        };
    </script>

</body>
</html>
