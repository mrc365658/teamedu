<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhóm Chat Nội Bộ Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        :root { --primary: #0084FF; --primary-hover: #0073E6; --bg-color: #F3F4F6; --chat-bg: #FFFFFF; --text-main: #111827; --text-muted: #6B7280; --msg-sent: #0084FF; --msg-received: #E4E6EB; --admin-bg: #111827; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%); height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        .container { width: 100%; max-width: 450px; height: 90vh; background: var(--chat-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* Screens */
        .screen { display: none; flex-direction: column; height: 100%; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--chat-bg); z-index: 10; }
        .screen.active { display: flex; }

        .center-screen { justify-content: center; align-items: center; padding: 2rem; text-align: center; }
        .logo-circle { width: 80px; height: 80px; background: var(--primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 2rem; margin-bottom: 1.5rem; }
        h2 { margin-bottom: 0.5rem; color: var(--text-main); }
        p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }
        
        button { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        button:hover { background: var(--primary-hover); }
        button.google-btn { background: #fff; color: #333; border: 1px solid #ddd; }
        button.google-btn:hover { background: #f9f9f9; }
        button.danger { background: #DC2626; }
        button.danger:hover { background: #B91C1C; }

        /* Header */
        .chat-header { padding: 1rem 1.5rem; background: var(--chat-bg); border-bottom: 1px solid #E5E7EB; display: flex; justify-content: space-between; align-items: center; z-index: 11; }
        .chat-header h3 { color: var(--text-main); font-size: 1.1rem; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .user-badge { font-size: 0.8rem; color: var(--text-muted); background: var(--bg-color); padding: 0.3rem 0.8rem; border-radius: 20px; }
        .admin-btn { padding: 0.3rem 0.8rem; font-size: 0.8rem; width: auto; background: var(--admin-bg); border-radius: 20px;}
        .logout-btn { background: transparent; color: var(--text-muted); padding: 0; width: auto; font-size: 0.8rem; font-weight: normal; }
        .logout-btn:hover { background: transparent; text-decoration: underline; color: #DC2626; }

        /* Chat Area (Messenger Style) */
        .chat-messages { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.2rem; background: #FFFFFF; }
        
        .message-row { display: flex; width: 100%; position: relative; }
        .message-row.sent { justify-content: flex-end; }
        .message-row.received { justify-content: flex-start; }
        
        .message { max-width: 75%; display: flex; flex-direction: column; position: relative; }
        .message-sender { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.2rem; margin-left: 0.5rem; }
        .message-row.sent .message-sender { display: none; }
        
        .message-content-wrapper { display: flex; align-items: center; gap: 5px; }
        .message-row.sent .message-content-wrapper { flex-direction: row-reverse; }

        .message-content { padding: 0.7rem 1rem; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .message-row.sent .message-content { background: var(--msg-sent); color: white; border-bottom-right-radius: 4px; }
        .message-row.received .message-content { background: var(--msg-received); color: #050505; border-bottom-left-radius: 4px; }
        
        .message-time { font-size: 0.65rem; color: var(--text-muted); margin-top: 3px; margin-right: 5px; margin-left: 5px; align-self: flex-end; }
        .message-row.received .message-time { align-self: flex-start; }

        /* Tools inside chat */
        .delete-btn { font-size: 0.8rem; cursor: pointer; color: #DC2626; opacity: 0; padding: 5px; transition: 0.2s; background: none; border: none; }
        .message-row.sent:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: #FEE2E2; border-radius: 50%; }

        .file-attachment { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.05); padding: 10px; border-radius: 10px; text-decoration: none; color: inherit; border: 1px solid rgba(0,0,0,0.1); }
        .message-row.sent .file-attachment { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.3); }
        .file-icon { font-size: 1.5rem; }
        .file-name { font-size: 0.85rem; font-weight: 500; word-break: break-all; }

        /* Input Area */
        .chat-input { padding: 1rem; background: var(--chat-bg); border-top: 1px solid #E5E7EB; display: flex; gap: 0.5rem; align-items: center; }
        .chat-input input[type="text"] { flex: 1; border-radius: 20px; padding: 0.8rem 1.2rem; border: 1px solid #E5E7EB; outline: none; background: #F0F2F5;}
        .chat-input input[type="text"]:focus { border-color: var(--primary); }
        .chat-input button.send-btn { width: auto; padding: 0.8rem 1.2rem; border-radius: 20px; background: var(--primary); }
        
        .icon-btn { cursor: pointer; padding: 0.5rem; border-radius: 50%; color: var(--primary); font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .icon-btn:hover { background: #F0F2F5; }

        /* Drag & Drop Overlay */
        #drop-zone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 132, 255, 0.9); color: white; display: none; justify-content: center; align-items: center; z-index: 100; font-size: 1.5rem; font-weight: 600; flex-direction: column; border-radius: 20px; border: 4px dashed white; margin: 10px; width: calc(100% - 20px); height: calc(100% - 20px); pointer-events: none;}
        #drop-zone.dragover { display: flex; }

        /* Admin Panel */
        #admin-panel { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 20; justify-content: center; align-items: flex-end; }
        .admin-content { background: white; width: 100%; height: 80%; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 1.5rem; display: flex; flex-direction: column; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .close-admin { cursor: pointer; font-size: 1.5rem; color: var(--text-muted); }
        .user-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }
        .user-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; background: var(--bg-color); border-radius: 10px; }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: 8px; width: auto; }
        .btn-approve { background: #10B981; }
    </style>
</head>
<body>

    <div class="container">
        <div id="drop-zone">
            <span style="font-size: 3rem; margin-bottom: 10px;">📂</span>
            Thả file vào đây để gửi
        </div>

        <div id="login-screen" class="screen center-screen active">
            <div class="logo-circle">💬</div>
            <h2>Nội Bộ Nhóm</h2>
            <p>Vui lòng đăng nhập để tham gia</p>
            <button class="google-btn" onclick="loginWithGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                Đăng nhập bằng Google
            </button>
            <p id="login-error-msg" style="color: red; margin-top: 10px; display: none;"></p>
        </div>

        <div id="waiting-screen" class="screen center-screen">
            <div class="logo-circle" style="background: #F59E0B;">⏳</div>
            <h2>Đang chờ duyệt</h2>
            <p>Tài khoản của bạn đã được ghi nhận. Vui lòng đợi Admin phê duyệt để vào phòng chat.</p>
            <button class="danger" onclick="logout()" style="width: auto; padding: 0.5rem 1rem;">Đăng xuất</button>
        </div>

        <div id="chat-screen" class="screen">
            <div class="chat-header">
                <h3>Phòng Chung</h3>
                <div class="header-actions">
                    <button id="btn-show-admin" class="admin-btn" style="display: none;" onclick="toggleAdminPanel(true)">Quản lý</button>
                    <span class="user-badge" id="current-user-display">User</span>
                    <button class="logout-btn" onclick="logout()">Thoát</button>
                </div>
            </div>
            
            <div class="chat-messages" id="chat-messages"></div>

            <div class="chat-input">
                <input type="file" id="file-upload" style="display: none;" onchange="handleFileSelect(event)">
                <div class="icon-btn" onclick="document.getElementById('file-upload').click()" title="Đính kèm file/ảnh">📎</div>
                
                <input type="text" id="message-input" placeholder="Nhập tin nhắn..." autocomplete="off" onkeypress="handleSendPress(event)">
                <button class="send-btn" onclick="sendMessage()">Gửi</button>
            </div>
        </div>

        <div id="admin-panel">
            <div class="admin-content">
                <div class="admin-header">
                    <h3>Quản lý thành viên</h3>
                    <span class="close-admin" onclick="toggleAdminPanel(false)">&times;</span>
                </div>
                <div class="user-list" id="pending-users-list"></div>
            </div>
        </div>
    </div>

    <script>
        // CẤU HÌNH FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDSjjQStfQIpSPpz28VAolRKC3VVjvPkGg",
            authDomain: "hihihaha-6df13.firebaseapp.com",
            projectId: "hihihaha-6df13",
            storageBucket: "hihihaha-6df13.firebasestorage.app",
            messagingSenderId: "841162292047",
            appId: "1:841162292047:web:f9529e2e0408c525d1633a",
            databaseURL: "https://hihihaha-6df13-default-rtdb.firebaseio.com/" 
        };

        // Khởi tạo
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const storage = firebase.storage();
        const provider = new firebase.auth.GoogleAuthProvider();

        const ADMIN_EMAIL = "cuongcong240811@gmail.com";
        let currentUserData = null;
        let messagesListenerAdded = null;
        let messagesListenerRemoved = null;
        let userStatusListener = null;

        // --- QUẢN LÝ TRẠNG THÁI ĐĂNG NHẬP ---
        auth.onAuthStateChanged((user) => {
            if (user) {
                checkAndRouteUser(user);
            } else {
                showScreen('login-screen');
                cleanupListeners();
            }
        });

        function loginWithGoogle() {
            const errorMsg = document.getElementById('login-error-msg');
            errorMsg.style.display = 'none';

            // Dùng Popup vì nó ít bị lỗi "Partitioned Storage" trên điện thoại nhất
            auth.signInWithPopup(provider).catch((error) => {
                errorMsg.style.display = 'block';
                if (error.code === 'auth/popup-blocked') {
                    errorMsg.innerText = "Trình duyệt chặn mở cửa sổ. Vui lòng cho phép mở Popup trong cài đặt.";
                } else if (error.code === 'auth/unauthorized-domain') {
                    errorMsg.innerText = "Lỗi tên miền. Chú ý: Hãy truy cập bằng chữ 'localhost', KHÔNG dùng '127.0.0.1'.";
                } else {
                    errorMsg.innerText = "Lỗi đăng nhập: " + error.message;
                }
            });
        }

        function logout() { auth.signOut(); }

        function checkAndRouteUser(user) {
            const userRef = db.ref('users/' + user.uid);
            const currentLoginEmail = user.email.toLowerCase().trim();
            const adminEmailCheck = ADMIN_EMAIL.toLowerCase().trim();
        
            if (currentLoginEmail === adminEmailCheck) {
                userRef.update({ name: user.displayName, email: user.email, status: "approved", role: "admin" });
                currentUserData = { uid: user.uid, name: user.displayName, role: "admin" };
                document.getElementById('btn-show-admin').style.display = 'block'; 
                enterChat();
                return;
            }
        
            document.getElementById('btn-show-admin').style.display = 'none';
            if(userStatusListener) userRef.off('value', userStatusListener);
            
            userStatusListener = userRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data || data.status === "pending") {
                    if(!data) userRef.set({ name: user.displayName, email: user.email, status: "pending", role: "user" });
                    showScreen('waiting-screen');
                } else if (data.status === "approved") {
                    currentUserData = { uid: user.uid, name: user.displayName, role: "user" };
                    enterChat();
                } else {
                    alert("Tài khoản đã bị từ chối/khóa.");
                    logout();
                }
            });
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function enterChat() {
            showScreen('chat-screen');
            document.getElementById('current-user-display').innerText = currentUserData.name;
            setupDragAndDrop();
            loadMessages();
        }

        // --- DRAG & DROP & FILE UPLOAD ---
        function setupDragAndDrop() {
            const container = document.querySelector('.container');
            const dropZone = document.getElementById('drop-zone');

            container.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
            container.addEventListener('dragleave', (e) => {
                e.preventDefault();
                if (e.relatedTarget === null || !container.contains(e.relatedTarget)) dropZone.classList.remove('dragover');
            });
            container.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) processFileUpload(e.dataTransfer.files[0]);
            });
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) processFileUpload(file);
            event.target.value = ''; 
        }

        async function processFileUpload(file) {
            if (file.size > 10 * 1024 * 1024) return alert("File quá nặng! Chọn file dưới 10MB.");

            const inputField = document.getElementById('message-input');
            inputField.placeholder = "Đang tải file lên...";
            inputField.disabled = true;

            const isImage = file.type.startsWith('image/');
            const storageRef = storage.ref(`chat_files/${Date.now()}_${file.name}`);
            
            try {
                const snapshot = await storageRef.put(file);
                const downloadURL = await snapshot.ref.getDownloadURL();
                db.ref('messages').push({
                    uid: currentUserData.uid,
                    sender: currentUserData.name,
                    text: "",
                    fileUrl: downloadURL,
                    fileName: file.name,
                    fileType: isImage ? 'image' : 'document',
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            } catch (error) { alert("Lỗi tải file: " + error.message); } 
            finally { inputField.placeholder = "Nhập tin nhắn..."; inputField.disabled = false; inputField.focus(); }
        }

        // --- SEND & LOAD MESSAGES ---
        function handleSendPress(e) { if (e.key === 'Enter') sendMessage(); }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (text !== "" && currentUserData) {
                db.ref('messages').push({
                    uid: currentUserData.uid,
                    sender: currentUserData.name,
                    text: text,
                    fileUrl: null,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                input.value = '';
            }
        }

        function deleteMessage(msgId) {
            if(confirm("Bạn có chắc muốn thu hồi tin nhắn này?")) db.ref('messages/' + msgId).remove();
        }

        function formatTime(timestamp) {
            if (!timestamp) return "";
            return new Date(timestamp).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        }

        function loadMessages() {
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = ''; 
            
            if (messagesListenerAdded) db.ref('messages').off('child_added', messagesListenerAdded);
            if (messagesListenerRemoved) db.ref('messages').off('child_removed', messagesListenerRemoved);
            
            messagesListenerAdded = db.ref('messages').orderByChild('timestamp').on('child_added', (snapshot) => {
                const msg = snapshot.val();
                const type = msg.uid === currentUserData.uid ? 'sent' : 'received';
                appendMessage(snapshot.key, msg, type);
            });

            messagesListenerRemoved = db.ref('messages').on('child_removed', (snapshot) => {
                const element = document.getElementById('msg-' + snapshot.key);
                if (element) element.remove();
            });
        }

        function appendMessage(key, msg, type) {
            const chatBox = document.getElementById('chat-messages');
            const rowDiv = document.createElement('div');
            rowDiv.className = `message-row ${type}`;
            rowDiv.id = `msg-${key}`;
            
            let contentHTML = '';
            if (msg.fileType === 'image') {
                contentHTML = `<img src="${msg.fileUrl}" style="max-width: 200px; border-radius: 15px; cursor: pointer;" onclick="window.open('${msg.fileUrl}', '_blank')">`;
            } else if (msg.fileType === 'document') {
                contentHTML = `<a href="${msg.fileUrl}" target="_blank" class="file-attachment"><span class="file-icon">📄</span><span class="file-name">${msg.fileName}</span></a>`;
            } else if (msg.text) {
                contentHTML = `<div class="message-content">${msg.text}</div>`;
            }

            const deleteBtnHTML = type === 'sent' ? `<button class="delete-btn" onclick="deleteMessage('${key}')" title="Thu hồi">🗑️</button>` : '';
            const timeHTML = `<div class="message-time">${formatTime(msg.timestamp)}</div>`;

            rowDiv.innerHTML = `
                <div class="message">
                    <span class="message-sender">${msg.sender}</span>
                    <div class="message-content-wrapper">${contentHTML}${deleteBtnHTML}</div>
                    ${timeHTML}
                </div>
            `;
            chatBox.appendChild(rowDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function cleanupListeners() {
            if (messagesListenerAdded) db.ref('messages').off('child_added', messagesListenerAdded);
            if (messagesListenerRemoved) db.ref('messages').off('child_removed', messagesListenerRemoved);
            if (userStatusListener && auth.currentUser) db.ref('users/' + auth.currentUser.uid).off('value', userStatusListener);
            document.getElementById('chat-messages').innerHTML = '';
            currentUserData = null;
        }

        // --- TÍNH NĂNG ADMIN ---
        function toggleAdminPanel(show) {
            document.getElementById('admin-panel').style.display = show ? 'flex' : 'none';
            if (show) loadPendingUsers();
        }

        function loadPendingUsers() {
            const listRef = document.getElementById('pending-users-list');
            listRef.innerHTML = '<p style="text-align:center; color:gray; font-size: 0.9rem;">Đang tải...</p>';
            db.ref('users').once('value', (snapshot) => {
                listRef.innerHTML = '';
                let hasPending = false;
                snapshot.forEach((child) => {
                    const user = child.val();
                    if (user.status === 'pending') {
                        hasPending = true;
                        listRef.innerHTML += `
                            <div class="user-item">
                                <div class="user-info">
                                    <span class="user-name">${user.name}</span>
                                    <span class="user-email">${user.email}</span>
                                </div>
                                <div class="user-actions">
                                    <button class="btn-sm btn-approve" onclick="updateUserStatus('${child.key}', 'approved')">Duyệt</button>
                                    <button class="btn-sm danger" onclick="updateUserStatus('${child.key}', 'rejected')">Từ chối</button>
                                </div>
                            </div>
                        `;
                    }
                });
                if (!hasPending) listRef.innerHTML = '<p style="text-align:center; color:gray; font-size: 0.9rem;">Không có ai đang chờ duyệt.</p>';
            });
        }
        function updateUserStatus(uid, status) {
            db.ref('users/' + uid).update({ status: status }).then(() => { loadPendingUsers(); }).catch(err => alert("Lỗi: " + err.message));
        }
    </script>
</body>
</html>
