<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhóm Chat Nội Bộ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --primary: #4F46E5; --primary-hover: #4338CA; --bg-color: #F3F4F6; --chat-bg: #FFFFFF; --text-main: #111827; --text-muted: #6B7280; --msg-sent: #4F46E5; --msg-received: #F3F4F6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 100%; max-width: 450px; height: 90vh; background: var(--chat-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 2rem; text-align: center; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--chat-bg); z-index: 10; }
        .logo-circle { width: 80px; height: 80px; background: var(--primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 2rem; margin-bottom: 1.5rem; }
        #login-screen h2 { margin-bottom: 0.5rem; color: var(--text-main); }
        #login-screen p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }
        .input-group { width: 100%; display: flex; flex-direction: column; gap: 1rem; }
        input { width: 100%; padding: 1rem; border: 1px solid #E5E7EB; border-radius: 10px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--primary-hover); }
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        .chat-header { padding: 1rem 1.5rem; background: var(--chat-bg); border-bottom: 1px solid #E5E7EB; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h3 { color: var(--text-main); font-size: 1.1rem; }
        .user-badge { font-size: 0.8rem; color: var(--text-muted); background: var(--bg-color); padding: 0.3rem 0.8rem; border-radius: 20px; }
        .chat-messages { flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; background: #FAFAFA; }
        .message { max-width: 80%; display: flex; flex-direction: column; }
        .message.sent { align-self: flex-end; }
        .message.received { align-self: flex-start; }
        .message-sender { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.2rem; margin-left: 0.5rem; }
        .message.sent .message-sender { display: none; }
        .message-content { padding: 0.8rem 1.2rem; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .message.sent .message-content { background: var(--msg-sent); color: white; border-bottom-right-radius: 4px; }
        .message.received .message-content { background: var(--msg-received); color: var(--text-main); border-bottom-left-radius: 4px; }
        .chat-input { padding: 1rem; background: var(--chat-bg); border-top: 1px solid #E5E7EB; display: flex; gap: 0.5rem; }
        .chat-input input { flex: 1; border-radius: 20px; padding: 0.8rem 1.2rem; }
        .chat-input button { width: auto; padding: 0.8rem 1.5rem; border-radius: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="login-screen">
            <div class="logo-circle">💬</div>
            <h2>Nội Bộ Nhóm</h2>
            <p>Vui lòng nhập tên của bạn để tham gia</p>
            <div class="input-group">
                <input type="text" id="username-input" placeholder="Tên hiển thị..." autocomplete="off" onkeypress="handleLoginPress(event)">
                <button onclick="joinChat()">Vào Phòng Chat</button>
            </div>
        </div>

        <div id="chat-screen">
            <div class="chat-header">
                <h3>Phòng Chung</h3>
                <span class="user-badge" id="current-user-display">User</span>
            </div>
            
            <div class="chat-messages" id="chat-messages"></div>

            <div class="chat-input">
                <input type="text" id="message-input" placeholder="Nhập tin nhắn..." autocomplete="off" onkeypress="handleSendPress(event)">
                <button onclick="sendMessage()">Gửi</button>
            </div>
        </div>
    </div>

    <script>
        // THÔNG TIN TỪ DỰ ÁN CỦA BẠN
        const firebaseConfig = {
            apiKey: "AIzaSyDSjjQStfQIpSPpz28VAolRKC3VVjvPkGg",
            authDomain: "hihihaha-6df13.firebaseapp.com",
            projectId: "hihihaha-6df13",
            storageBucket: "hihihaha-6df13.firebasestorage.app",
            messagingSenderId: "841162292047",
            appId: "1:841162292047:web:f9529e2e0408c525d1633a",
            databaseURL: "https://hihihaha-6df13-default-rtdb.firebaseio.com/" 
        };

        // Khởi tạo
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const messagesRef = db.ref('messages');

        let currentUser = "";

        function joinChat() {
            const usernameInput = document.getElementById('username-input');
            const name = usernameInput.value.trim();
            
            if (name !== "") {
                currentUser = name;
                document.getElementById('current-user-display').innerText = currentUser;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('chat-screen').style.display = 'flex';
                loadMessages();
            } else {
                alert("Vui lòng nhập tên của bạn!");
            }
        }

        function handleLoginPress(e) { if (e.key === 'Enter') joinChat(); }
        function handleSendPress(e) { if (e.key === 'Enter') sendMessage(); }

        function sendMessage() {
            const messageInput = document.getElementById('message-input');
            const text = messageInput.value.trim();

            if (text !== "") {
                messagesRef.push({
                    sender: currentUser,
                    text: text,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                messageInput.value = '';
            }
        }

        function loadMessages() {
            messagesRef.on('child_added', (snapshot) => {
                const messageData = snapshot.val();
                const type = messageData.sender === currentUser ? 'sent' : 'received';
                appendMessage(messageData.sender, messageData.text, type);
            });
        }

        function appendMessage(sender, text, type) {
            const chatBox = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const senderSpan = document.createElement('span');
            senderSpan.className = 'message-sender';
            senderSpan.innerText = sender;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerText = text;
            
            messageDiv.appendChild(senderSpan);
            messageDiv.appendChild(contentDiv);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
